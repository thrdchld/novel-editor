project:
  title: "Nama Proyek"
  genre_context: []  # Konteks saja; tidak mengaktifkan penilaian gaya/tone.
  language: "id"
  audit_mode: "review_and_edit_on_explicit_request"

manuscript:
  # Sesuaikan dengan lokasi naskah. Jangan memasukkan dokumentasi auditor sebagai naskah.
  include:
    - "Story/**/*.md"
    - "chapters/**/*.md"
    - "naskah/**/*.md"
    - "naskah/**/*.txt"
  exclude:
    - "**/archive/**"
    - "**/draft-old/**"
    - "**/draft_old/**"
    - "**/novel-editor-reports/**"

references:
  canon: []
  world_bible: []
  character_bible: []
  outline: []
  timeline: []
  continuity_ledger: []
  glossary: []
  other: []

constraints:
  em_dash_forbidden: false
  word_count:
    enabled: false
    min_per_chapter: null
    max_per_chapter: null
  markdown_format:
    enabled: true
    check_unclosed_fences: true
    check_chapter_sequence: true
    chapter_heading_regex: '^#{1,6}\\s+\\*{0,2}BAB\\s+(\\d+)\\b'
    stray_note_patterns:
      - '(?i)\\bTODO\\b'
      - '(?i)\\bFIXME\\b'
      - '(?i)CATATAN EDITOR'
      - '(?i)NOTE TO SELF'
      - '(?i)\\[PLACEHOLDER\\]'
  custom_rules: []

worldbuilding:
  track_explicit_rules: true
  track_limits_and_costs: true
  track_exceptions: true
  track_institutions_and_systems: true
  track_geography_and_travel: true

continuity:
  track_character_state: true
  track_character_knowledge: true
  track_objects: true
  track_locations: true
  track_relationships: true
  track_money_and_resources: true
  track_timeline: true

technical_review:
  enabled: true
  check_spelling_and_grammar_contextually: true
  check_punctuation: true
  check_name_and_term_consistency: true
  check_editorial_artifacts: true
  check_markdown_rendering: true
  check_chapter_structure: true

report:
  output_dir: "novel-editor-reports"
  include_quotes: true
  include_minimal_recommendations: true
  edit_policy: "only_on_explicit_user_request"
