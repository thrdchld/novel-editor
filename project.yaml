# Root defaults for the Novel Editor. Each novel is independent under Story/<Title>/.
editor:
  name: "Novel Editor"
  scope: "genre-agnostic technical editing"
  default_workflow: "automatic_audit_repair_verify"
  preserve_authorial_style: true
  preserve_creative_decisions: true
  genre_is_descriptive_only: true
story_projects:
  root: "Story"
  discovery: "one folder per novel"
  entry_files: ["outline.md", "project.yaml"]
  optional_references: ["canon.md", "timeline.md", "character-bible.md", "world-bible.md", "continuity-ledger.md", "glossary.md"]
  manuscript_locations: ["chapters/**/*.md", "manuscript.md", "naskah/**/*.md", "naskah/**/*.txt"]
  report_directory: "reports"
outline:
  template: "../templates/outline-template.md"
  guide: "../templates/outline-template-guide.md"
  validation_rules: "../rules/14-outline-validation.md"
  format_agnostic: true
  allow_additional_sections: true
  allow_freeform_notes: true
  mark_unknown_values: true
audit:
  outline_before_drafting: true
  manuscript_against_approved_outline: true
  cross_chapter_audit: true
  automatic_repair: true
  verify_after_repair: true
  ask_only_for_unresolved_material_creative_choices: true
repair_policy:
  technical_corrections: "automatic"
  preserve_locked_canon: true
  preserve_tone_voice_diction_and_style: true
  no_unrequested_creative_rewrites: true
  no_silent_canon_retcon: true
constraints:
  genre_formulas_enabled: false
  worldbuilding_depth: "proportional_to_story"
  word_count:
    enabled: false
    min_per_chapter: null
    max_per_chapter: null
  markdown_format:
    enabled: true
    check_unclosed_fences: true
    check_chapter_sequence: true
  custom_rules: []
report:
  include_scope_and_limitations: true
  include_evidence_and_line_locations: true
  include_changes_applied: true
  include_verification_results: true
  include_publication_readiness: true
